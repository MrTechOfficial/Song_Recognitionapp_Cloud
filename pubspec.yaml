name: song_recognition_app
description: "A hands-free song identifier Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  audio_service: ^0.18.12
  audioplayers: ^6.0.0
  http: ^1.2.0
  path_provider: ^2.1.2
  permission_handler: ^13.0.1
  record: ^7.1.1
  shared_preferences: ^2.5.5
  url_launcher: ^6.3.0
  share_plus: ^13.3.0
  connectivity_plus: ^6.0.0
  geolocator: ^14.0.3
  flutter_staggered_grid_view: ^0.7.0
  fl_chart: ^1.2.0
  flutter_web_auth_2: ^3.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  
  assets:
    - assets/silence.mp3
    - assets/ding.mp3
    - assets/world_map.png
    
dependency_overrides:
  record_platform_interface: ^2.1.0

flutter_launcher_icons:
  ios: true
  android: false
  image_path: "assets/app_icon.png"
  remove_alpha_ios: true

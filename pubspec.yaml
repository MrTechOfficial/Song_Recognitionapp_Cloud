name: song_recognition_app
description: "A hands-free song identifier Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  audio_service: ^0.18.12
  audioplayers: ^6.0.0
  http: ^1.2.0
  permission_handler: ^11.3.0
  record: ^5.1.0
  url_launcher: ^6.3.0
  path_provider: ^2.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/silence.mp3
dependency_overrides:
  record_platform_interface: 1.2.0